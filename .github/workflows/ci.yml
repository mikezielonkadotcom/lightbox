name: CI

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-package:
    name: Validate Plugin Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Test and build admin interface
        run: |
          npm ci
          npm run format:check
          npm run lint:js
          npm run test:js
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: none

      - name: Validate source
        shell: bash
        run: bash scripts/validate-plugin-package.sh

      - name: Build release ZIP dry run
        shell: bash
        run: bash scripts/build-plugin-zip.sh

      - name: Validate release ZIP
        shell: bash
        run: bash scripts/validate-plugin-package.sh --zip release/little-lightbox.zip

      - name: Upload dry-run ZIP
        uses: actions/upload-artifact@v7
        with:
          name: little-lightbox-ci-package
          path: release/little-lightbox.zip
          retention-days: 7
